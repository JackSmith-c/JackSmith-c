<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="System architecture: infra fisheye and LiDAR sensors fuse into a positioning engine that drives V2X control for autonomous unloading and digital twin parking">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03060F"/>
      <stop offset="1" stop-color="#071426"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E7490"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22D3EE"/>
    </marker>
    <marker id="arw2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4ADE80"/>
    </marker>
  </defs>

  <rect width="1200" height="420" fill="url(#abg)"/>
  <g stroke="#1E293B" stroke-width="1" stroke-opacity="0.5">
    <path d="M0 60 H1200"/><path d="M0 140 H1200"/><path d="M0 220 H1200"/><path d="M0 300 H1200"/><path d="M0 380 H1200"/>
  </g>

  <text x="60" y="42" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#475569" letter-spacing="3">INPUT — INFRASTRUCTURE &amp; VEHICLE</text>
  <text x="470" y="42" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#475569" letter-spacing="3">FUSION</text>
  <text x="822" y="42" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#475569" letter-spacing="3">CONTROL &amp; OUTPUT</text>

  <!-- inputs -->
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <rect x="60" y="78" width="250" height="76" rx="10" fill="#0B1B2E" stroke="#22D3EE" stroke-opacity="0.55"/>
    <text x="82" y="108" font-size="17" font-weight="700" fill="#E2E8F0">Infra Fisheye</text>
    <text x="82" y="132" font-size="13" fill="#7DD3FC">2D wide-FOV imagery · distortion-corrected</text>

    <rect x="60" y="172" width="250" height="76" rx="10" fill="#0B1B2E" stroke="#4ADE80" stroke-opacity="0.55"/>
    <text x="82" y="202" font-size="17" font-weight="700" fill="#E2E8F0">Infra LiDAR</text>
    <text x="82" y="226" font-size="13" fill="#86EFAC">3D point cloud (PCD) map</text>

    <rect x="60" y="266" width="250" height="76" rx="10" fill="#0B1B2E" stroke="#A855F7" stroke-opacity="0.55"/>
    <text x="82" y="296" font-size="17" font-weight="700" fill="#E2E8F0">Vehicle Sensors</text>
    <text x="82" y="320" font-size="13" fill="#D8B4FE">AVM camera (Vision) · on-board LiDAR</text>
  </g>

  <!-- arrows in -->
  <g stroke="#22D3EE" stroke-width="1.6" fill="none" marker-end="url(#arw)" stroke-opacity="0.75">
    <path d="M310 116 C 380 116, 400 180, 452 196"/>
    <path d="M310 210 H452"/>
    <path d="M310 304 C 380 304, 400 240, 452 222"/>
  </g>

  <!-- core -->
  <rect x="460" y="140" width="270" height="140" rx="14" fill="url(#core)" fill-opacity="0.20" stroke="#22D3EE" stroke-width="1.6"/>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <text x="595" y="178" font-size="19" font-weight="700" fill="#F8FAFC">Sensor Fusion Engine</text>
    <text x="595" y="204" font-size="13" fill="#7DD3FC">2D–2D image matching</text>
    <text x="595" y="224" font-size="13" fill="#86EFAC">2D–3D image · LiDAR fusion</text>
    <rect x="500" y="238" width="190" height="28" rx="14" fill="#052E2B" stroke="#4ADE80" stroke-opacity="0.7"/>
    <text x="595" y="257" font-size="13" font-weight="700" fill="#4ADE80">positioning error ≤ 30.5 cm</text>
  </g>

  <!-- arrow to v2x -->
  <path d="M730 210 H812" stroke="#4ADE80" stroke-width="1.6" fill="none" marker-end="url(#arw2)" stroke-opacity="0.8"/>

  <!-- v2x -->
  <rect x="818" y="172" width="120" height="76" rx="10" fill="#0B1B2E" stroke="#4ADE80" stroke-opacity="0.6"/>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <text x="878" y="202" font-size="17" font-weight="700" fill="#E2E8F0">V2X</text>
    <text x="878" y="224" font-size="12" fill="#86EFAC">SDV control</text>
  </g>

  <g stroke="#4ADE80" stroke-width="1.6" fill="none" marker-end="url(#arw2)" stroke-opacity="0.75">
    <path d="M938 196 C 985 196, 990 140, 1024 128"/>
    <path d="M938 224 C 985 224, 990 280, 1024 292"/>
  </g>

  <!-- outputs -->
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <rect x="1030" y="90" width="140" height="76" rx="10" fill="#052E2B" stroke="#4ADE80" stroke-opacity="0.55"/>
    <text x="1100" y="120" font-size="15" font-weight="700" fill="#E2E8F0" text-anchor="middle">Autonomous</text>
    <text x="1100" y="140" font-size="15" font-weight="700" fill="#E2E8F0" text-anchor="middle">Unloading</text>

    <rect x="1030" y="254" width="140" height="76" rx="10" fill="#1E1B4B" stroke="#A855F7" stroke-opacity="0.55"/>
    <text x="1100" y="284" font-size="15" font-weight="700" fill="#E2E8F0" text-anchor="middle">Digital Twin</text>
    <text x="1100" y="304" font-size="15" font-weight="700" fill="#E2E8F0" text-anchor="middle">Parking (PMS)</text>
  </g>

  <text x="60" y="392" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#475569">No GNSS required — positioning is computed by the infrastructure, so any vehicle sensor stack is supported.</text>
</svg>
